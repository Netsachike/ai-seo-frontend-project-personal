openapi: 3.1.0
info:
  title: Orbit API (frontend contract draft)
  version: 0.1.0
  description: |
    Contract the frontend is built against while the backend is developed in
    parallel. Every endpoint here is mocked in `src/lib/mocks`. Items marked
    "ASSUMPTION" need confirmation from the backend developer.

    Conventions (ASSUMPTION):
    - Base URL from NEXT_PUBLIC_API_URL, e.g. https://api.orbit.example/v1
    - Every request carries `X-Workspace-Id` once a workspace is active.
    - Auth via an httpOnly session cookie set by /auth/login.
    - Errors use `Problem` (RFC 9457 style) with a stable `code`.
    - Timestamps are ISO 8601 UTC strings; the client localizes them.
    - Long work returns `202 { jobId }`; the client polls GET /jobs/{id} every 3 s.
servers:
  - url: https://api.orbit.example/v1
security:
  - session: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
    patch:
      operationId: updateMe
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/MeUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Workspace" } } } }
    post:
      operationId: createWorkspace
      requestBody:
        content:
          application/json:
            schema:
              { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } }
      responses:
        "201":
          {
            description: Created,
            content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } },
          }
  /workspaces/{workspaceId}/brands:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      operationId: listBrands
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Brand" } } } }
  /workspaces/{workspaceId}/usage:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      operationId: getUsage
      description: Plan, limits and credit balance. Limits are never hard-coded on the client.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Usage" } } } }
  /brands/{brandId}/summary:
    parameters:
      - { $ref: "#/components/parameters/BrandId" }
      - { $ref: "#/components/parameters/Range" }
    get:
      operationId: getBrandSummary
      responses:
        "200":
          { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BrandSummary" } } } }
  /jobs/{jobId}:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getJob
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: OK
          content:
            { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notification" } } } }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      responses:
        "204": { description: No content }
  /agent/threads/{threadId}:
    parameters: [{ name: threadId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getAgentThread
      description: The same thread is shared by the web app and Telegram.
      responses:
        "200":
          { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentThread" } } } }
  /agent/messages:
    post:
      operationId: sendAgentMessage
      description: |
        Returns the stored user message. The reply streams over
        GET /agent/threads/{threadId}/stream (SSE, ASSUMPTION). `locale`
        makes Orbit answer in the user's UI language.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [threadId, text, locale]
              properties:
                threadId: { type: string }
                text: { type: string, minLength: 1 }
                locale: { type: string }
      responses:
        "201":
          {
            description: Created,
            content: { application/json: { schema: { $ref: "#/components/schemas/AgentMessage" } } },
          }
  /approvals/{approvalId}/decision:
    parameters: [{ name: approvalId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: decideApproval
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: orbit_session }
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string } }
    BrandId: { name: brandId, in: path, required: true, schema: { type: string } }
    Range:
      name: range
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Range" }
  schemas:
    Problem:
      type: object
      required: [code, title, status]
      properties:
        code: { type: string, description: "Stable machine code, e.g. engine_unavailable, publish_failed" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Range: { type: string, enum: ["7d", "30d", "90d", custom], default: "30d" }
    Engine: { type: string, enum: [chatgpt, gemini, perplexity, claude, aio] }
    Role: { type: string, enum: [owner, admin, member, viewer] }
    ThemePreference: { type: string, enum: [light, dark, system] }
    PlanTier: { type: string, enum: [free, growth, agency] }
    Me:
      type: object
      required: [id, name, email, locale, theme, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: [string, "null"] }
        locale: { type: string, description: UI language }
        theme: { $ref: "#/components/schemas/ThemePreference" }
        timezone: { type: string, description: IANA zone }
        telegram:
          type: [object, "null"]
          properties:
            handle: { type: string }
            connected: { type: boolean }
    MeUpdate:
      type: object
      properties:
        name: { type: string }
        locale: { type: string }
        theme: { $ref: "#/components/schemas/ThemePreference" }
        timezone: { type: string }
    Plan:
      type: object
      required: [id, name, tier, isTopTier]
      properties:
        id: { type: string }
        name: { type: string, description: "Display name, e.g. Growth" }
        tier: { $ref: "#/components/schemas/PlanTier" }
        isTopTier: { type: boolean, description: "Hides the Upgrade button when true" }
    Workspace:
      type: object
      required: [id, name, role, plan, memberCount, brandCount]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        plan: { $ref: "#/components/schemas/Plan" }
        memberCount: { type: integer }
        brandCount: { type: integer }
        lastBrandSlug:
          {
            type: [string, "null"],
            description: "ASSUMPTION: server remembers the last-used brand per user and workspace",
          }
    Brand:
      type: object
      required: [id, slug, name, domain, contentLanguage, market]
      properties:
        id: { type: string }
        slug: { type: string, description: "URL segment for /[brand]/…" }
        name: { type: string }
        domain: { type: string }
        contentLanguage:
          { type: string, description: "Language Orbit writes in. Separate from the user's UI language." }
        market: { type: string, description: "ISO 3166-1 alpha-2 country" }
    UsageMeter:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer }
    Usage:
      type: object
      required: [plan, credits, breakdown, renewsAt]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        credits:
          type: object
          required: [remaining, total]
          properties:
            remaining: { type: integer }
            total: { type: integer }
        breakdown:
          type: object
          required: [scans, articles, prompts]
          properties:
            scans: { $ref: "#/components/schemas/UsageMeter" }
            articles: { $ref: "#/components/schemas/UsageMeter" }
            prompts: { $ref: "#/components/schemas/UsageMeter" }
        renewsAt: { type: string, format: date-time }
    Delta:
      type: object
      description: Change versus the previous period of the same length.
      required: [value, unit]
      properties:
        value: { type: number }
        unit: { type: string, enum: [percent, points, count, rank] }
    EngineScore:
      type: object
      required: [engine, mentionRate]
      properties:
        engine: { $ref: "#/components/schemas/Engine" }
        mentionRate:
          {
            type: [number, "null"],
            description: "0–1 share of tracked questions; null when the engine was unreachable",
          }
    SeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: [number, "null"] }
    BrandSeries:
      type: object
      required: [brandId, name, isYou, points]
      properties:
        brandId: { type: string }
        name: { type: string }
        isYou: { type: boolean }
        points: { type: array, items: { $ref: "#/components/schemas/SeriesPoint" } }
    Kpi:
      type: object
      required: [key, value, delta, spark]
      properties:
        key: { type: string, enum: [mentionRate, avgAiPosition, googleTop10, aiCitations] }
        value: { type: number }
        total: { type: [number, "null"] }
        delta: { $ref: "#/components/schemas/Delta" }
        spark: { type: array, items: { type: number } }
    BrandSummary:
      type: object
      required: [status, visibility, engines, kpis, trend, shareOfVoice]
      properties:
        status: { type: string, enum: [ready, first_scan_running, no_data] }
        firstScanJobId: { type: [string, "null"] }
        visibility:
          type: object
          required: [score, delta, rank, brandCount]
          properties:
            score: { type: [number, "null"] }
            delta: { $ref: "#/components/schemas/Delta" }
            rank: { type: [integer, "null"] }
            brandCount: { type: integer }
            questionCount: { type: integer }
        engines: { type: array, items: { $ref: "#/components/schemas/EngineScore" } }
        kpis: { type: array, items: { $ref: "#/components/schemas/Kpi" } }
        trend: { type: array, items: { $ref: "#/components/schemas/BrandSeries" } }
        shareOfVoice:
          type: array
          items:
            type: object
            required: [brandId, name, isYou, share, delta]
            properties:
              brandId: { type: string }
              name: { type: string }
              isYou: { type: boolean }
              share: { type: number }
              delta: { $ref: "#/components/schemas/Delta" }
    JobStep:
      type: object
      required: [key, status, progress]
      properties:
        key: { type: string, description: "Engine id or step name" }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        retryAt: { type: [string, "null"], format: date-time }
    Job:
      type: object
      required: [id, type, status, progress, steps]
      properties:
        id: { type: string }
        type: { type: string, enum: [scan, audit, article, fix] }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        etaSeconds: { type: [integer, "null"] }
        steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
    Notification:
      type: object
      required: [id, kind, createdAt, read, href, params]
      properties:
        id: { type: string }
        kind: { type: string, enum: [agent_event, approval_waiting, scan_finished, team_invite] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        href: { type: string }
        params:
          {
            type: object,
            additionalProperties: { type: [string, number] },
            description: "ASSUMPTION: server sends structured params; the client owns the copy",
          }
    Approval:
      type: object
      required: [id, title, status, items, channels]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        items: { type: array, items: { type: string } }
        channels: { type: array, items: { type: string, enum: [web, telegram] } }
    TaskRef:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [waiting, working, done, failed] }
        jobId: { type: [string, "null"] }
        detail: { type: [string, "null"] }
    AgentMessage:
      type: object
      required: [id, role, createdAt, source, body]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, agent] }
        createdAt: { type: string, format: date-time }
        source: { type: string, enum: [web, telegram] }
        body: { type: string, description: Markdown (GFM tables allowed) }
        approval: { oneOf: [{ $ref: "#/components/schemas/Approval" }, { type: "null" }] }
        task: { oneOf: [{ $ref: "#/components/schemas/TaskRef" }, { type: "null" }] }
    AgentThread:
      type: object
      required: [id, messages]
      properties:
        id: { type: string }
        messages: { type: array, items: { $ref: "#/components/schemas/AgentMessage" } }
