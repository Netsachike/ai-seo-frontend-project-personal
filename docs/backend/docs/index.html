  <div id="swagger-ui"></div>
  <script type="text/plain" id="openapi-spec">openapi: 3.0.3
info:
  title: AI SEO Platform API
  version: 1.0.0
  description: |
    Front-end reference for every HTTP endpoint exposed under `/api`.

    ## Authentication
    Most endpoints use **Laravel Sanctum personal access tokens**.
    1. Call `POST /login` and read `data.token` from the response.
    2. Send it on every protected request:
       `Authorization: Bearer <token>`
    3. Always send `Accept: application/json` so errors come back as JSON instead of HTML redirects.

    ## CORS
    Browser calls are allowed only from these origins (`config/cors.php`):
    `https://app.rankoya.uk`, `http://localhost:3000`, `http://localhost:5173`, `http://127.0.0.1:3000`, `http://127.0.0.1:5173`.
    Any other origin, including this Swagger page opened from `file://`, is blocked by the browser. Use one of those dev ports, or Postman.
    `supports_credentials` is `true`.

    ## Changelog
    - **2026-10-20**: Added `DELETE /sites/{site}` (permanent, cascades to all site data).
      The WordPress.com OAuth callback now redirects to `{FRONTEND_URL}/settings/wordpress-com?connected=pending&pending_key=…` instead of returning JSON. ⚠️ It currently fails with 500, see that endpoint.
    - **2026-10-19**: Added **Workspaces** (6), **Account** (3), **Team** (5), **Reseller** (6) and **Admin** (14) endpoints. These use the `status` envelope (see below).
      Added `GET /sites/{site}/publishing/connections/{connection}/shopify-blogs`.
      `POST /sites/{site}/keywords/discover` now also returns a `dataforseo` block.
      The Search Console callback now redirects with `?connected={site_id}`, and the OAuth link is valid for 15 minutes.
      `PUT /sites/{site}/articles/{article}` now rewrites internal links in `content` and updates `internal_links`.
      Copilot can answer business-profile questions (`focus: business_profile`).
    - **2026-10-14**: Authority endpoints now **require a Bearer token**. The site must also belong to one of the user's workspaces, otherwise **404**.
      Added `GET /sites/{site}/authority/backlinks/summary`, `GET /sites/{site}/authority/backlinks` and `POST /sites/{site}/authority/backlink-prospects` (DataForSEO, can return **502**).
      CORS is now restricted to an allow-list (see above).
    - **2026-10-12**: Initial contract.

    ## Workspaces
    Every authenticated user has an *active workspace*. Site-scoped endpoints resolve it automatically from the token.
    - If the user has no workspace at all → **403** `{"message": "No workspace available."}`
    - If the workspace cannot be resolved → **422** `{"success": false, "message": "No active workspace found."}`

    ## Response envelopes
    The API does **not** use one envelope everywhere. Each endpoint below documents its exact shape, but there are four families:

    | Family | Shape | Used by |
    |---|---|---|
    | Standard success | `{ "success": true, "message"?: string, "data": ... }` | Most module endpoints |
    | Standard error | `{ "success": false, "message": string, "errors"?: object }` | Controller-handled errors |
    | Laravel framework error | `{ "message": string, "errors"?: object }` | 401, 404 (model not found), 422 (validation), 500 |
    | Raw / resource | API Resource (`{ "data": ... }`) or bare object | Sites, Crawler, Keywords list, Authority, Copilot, Money Page recommendations |
    | Status envelope | `{ "status": "success" \| "error", "message"?: string, "errors"?: object, ...named keys }` (no `data` key; payload uses keys like `user`, `workspace`, `users`) | Workspaces, Account, Team, Reseller, Admin |

    ⚠️ In the Status family, a few endpoints return `status` as a **boolean** (`true`/`false`) instead of a string: `POST /workspaces/{workspace}`, `POST /cancle/subscription` and `POST /user/sendCampaign`.

    ## Pagination
    Two pagination formats exist:
    - **Laravel paginator** (`LaravelPaginator`): `current_page`, `data[]`, `first_page_url`, `from`, `last_page`, `last_page_url`, `links[]`, `next_page_url`, `path`, `per_page`, `prev_page_url`, `to`, `total`. Use `?page=N`.
    - **API Resource collection** (`ResourcePaginated`): `{ data[], links{first,last,prev,next}, meta{current_page,from,last_page,links,path,per_page,to,total} }`.

    ## Number formatting
    Columns cast as `decimal:2` / `decimal:6` (scores, CPC, CTR, positions) are serialized by Laravel as **strings** (for example `"72.50"`). Parse them with `parseFloat()` on the front end.

    ## Error status codes (global)
    | Code | When | Body |
    |---|---|---|
    | 401 | Missing/invalid/expired Bearer token | `{"message": "Unauthenticated."}` |
    | 403 | No workspace, or OAuth state mismatch | `{"message": "..."}` or `{"success": false, "message": "..."}` |
    | 404 | Route-bound model id does not exist | `{"message": "No query results for model [App\\Models\\Site] 99"}` |
    | 422 | Validation failed | `{"message": "...", "errors": {"field": ["..."]}}` |
    | 500 | Unhandled exception (production hides details) | `{"message": "Server Error"}` |
  contact:
    name: Backend team
servers:
  - url: http://127.0.0.1:8001/api
    description: Local development
  - url: '{baseUrl}/api'
    description: Custom environment
    variables:
      baseUrl:
        default: https://api.example.com
        description: Scheme and host of the backend, with no trailing slash
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Login, logout, current user
  - name: Sites
    description: Websites tracked inside the active workspace
  - name: Crawler
    description: Crawl a site and inspect crawled pages
  - name: Keywords
    description: Keyword discovery, listing and analysis
  - name: Topical Maps
    description: Topic clusters built from keywords
  - name: Search Console
    description: Google Search Console OAuth, property selection and sync
  - name: SERP Research
    description: SERP results, competitors and content gaps
  - name: AI Visibility
    description: Test how the brand appears in AI assistant answers
  - name: SEO Opportunities
    description: Prioritized SEO opportunities
  - name: Content Planner
    description: Monthly content plans and calendar
  - name: Article Research
    description: Research briefs per keyword
  - name: Articles
    description: AI-generated article drafts
  - name: Publishing
    description: CMS connections and publishing articles
  - name: Publishing OAuth & Webhooks
    description: Public callbacks called by third parties (not by the front end directly)
  - name: Site Guard
    description: Technical SEO issues, fix proposals and verification
  - name: Money Pages
    description: Commercially important pages and recommendations
  - name: Authority
    description: Authority profile and backlink opportunities
  - name: Copilot
    description: Conversational SEO assistant
  - name: MCP
    description: Model Context Protocol tool bridge
  - name: Workspaces
    description: List, create, switch and manage workspaces
  - name: Account
    description: The logged-in user's own name, password and subscription
  - name: Team
    description: Team members and their workspace access
  - name: Reseller
    description: Client accounts created by a reseller
  - name: Admin
    description: Platform administration. Requires role admin or support.
  - name: Free Tools
    description: Public, unauthenticated SEO utilities

paths:
  # ───────────────────────────── AUTHENTICATION ─────────────────────────────
  /register:
    post:
      tags: [Authentication]
      summary: Register a new user
      operationId: register
      security: []
      description: |
        ⚠️ **Currently broken on the backend.** The route points to `AuthController::register`, which does not exist, so every call returns **500**.
        The body below is what `AuthService::register()` expects once the controller method is added.
        On success it is expected to return a user plus a token (same shape as `/login`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, format: password, example: secret-password }
      responses:
        '500':
          $ref: '#/components/responses/ServerError'

  /login:
    post:
      tags: [Authentication]
      summary: Log in and receive a Bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, format: password, example: secret-password }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Login successful }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/LoginUser' }
                      token:
                        type: string
                        description: Sanctum plain-text token. Send as `Authorization Bearer <token>`.
                        example: 1|LClmXJP4yWkXxNlnGw64NVrygt9JeHxQyIpVBiGj23767868
        '401':
          description: Wrong email/password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                message: Invalid credentials or email not verified
                errors: null
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /logout:
    post:
      tags: [Authentication]
      summary: Revoke the current token
      operationId: logout
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                message: Logged out successfully
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

  /me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user
      operationId: me
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Success }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────── SITES ─────────────────────────────
  /sites:
    get:
      tags: [Sites]
      summary: List sites in the active workspace
      operationId: listSites
      description: 'Returns an API Resource collection (`{ "data": [...] }`). It is **not paginated** and has **no** `success` key.'
      responses:
        '200':
          description: Sites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Sites]
      summary: Create a site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteRequest' }
      responses:
        '201':
          description: Site created. Response is wrapped in `data` (API Resource) with no `success` key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '422':
          description: Validation error, unparsable URL, or no active workspace
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validation:
                  summary: Validation failed
                  value:
                    message: The name field is required. (and 1 more error)
                    errors:
                      name: [The name field is required.]
                      url: [The url field must be a valid URL.]
                unparsableUrl:
                  summary: URL could not be parsed
                  value:
                    message: The website URL could not be parsed.
                    errors:
                      url: [The website URL could not be parsed.]
                noWorkspace:
                  summary: No active workspace
                  value: { success: false, message: No active workspace found. }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}:
    get:
      tags: [Sites]
      summary: Get one site (with settings)
      operationId: getSite
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404':
          description: Site not in the active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Site not found. }
        '422':
          description: No active workspace (framework abort format)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: No active workspace found. }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      tags: [Sites]
      summary: Permanently delete a site and all its data
      operationId: deleteSite
      description: |
        ⚠️ **Irreversible hard delete.** The database cascades to every child table: settings, crawl runs and pages, keywords, topical maps, Search Console data, SERP data, AI visibility, opportunities, content plans and calendar, research, articles, publishing connections and publications, Site Guard issues, money pages, authority data, and Copilot conversations.
        Ask the user to confirm before calling this. Afterwards, remove the site from local state and switch away from it if it was selected.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: Site deleted successfully. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404':
          description: Site does not exist or is not in the active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: 'No query results for model [App\Models\Site].' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/platform:
    patch:
      tags: [Sites]
      summary: Confirm or override the site's CMS platform
      operationId: confirmSitePlatform
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { $ref: '#/components/schemas/PlatformEnum' }
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404':
          description: Site not in the active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Site not found. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── CRAWLER ─────────────────────────────
  /sites/{site}/crawl:
    post:
      tags: [Crawler]
      summary: Start a crawl
      operationId: startCrawl
      description: Queues a crawl and returns immediately with **202**. Poll `GET /sites/{site}/crawl-runs/{crawlRun}` until `status` is `completed` or `failed`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max_pages: { type: integer, minimum: 1, maximum: 10000, default: 100 }
                respect_robots: { type: boolean, default: true }
                crawl_delay_ms: { type: integer, minimum: 0, maximum: 60000, default: 0 }
      responses:
        '202':
          description: Crawl queued (note there is **no** `success` key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Crawl started successfully. }
                  data: { $ref: '#/components/schemas/CrawlRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/SiteNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/crawl-runs/{crawlRun}:
    get:
      tags: [Crawler]
      summary: Get crawl run status
      operationId: getCrawlRun
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: crawlRun
          in: path
          required: true
          schema: { type: integer, example: 12 }
      responses:
        '200':
          description: Crawl run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CrawlRun' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/crawl-runs/{crawlRun}/pages:
    get:
      tags: [Crawler]
      summary: List pages crawled in a run (50 per page)
      operationId: listCrawlPages
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: crawlRun
          in: path
          required: true
          schema: { type: integer, example: 12 }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Crawled pages with a compact `meta` block
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CrawlPage' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer, example: 1 }
                      last_page: { type: integer, example: 3 }
                      per_page: { type: integer, example: 50 }
                      total: { type: integer, example: 128 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── KEYWORDS ─────────────────────────────
  /sites/{site}/keywords/discover:
    post:
      tags: [Keywords]
      summary: Discover keywords from the latest crawl (plus optional seeds)
      operationId: discoverKeywords
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seed_keywords:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 2, maxLength: 200 }
                  example: [seo audit, technical seo services]
      responses:
        '200':
          description: Discovery finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Keyword discovery completed. }
                  data:
                    type: object
                    properties:
                      keywords_discovered: { type: integer, example: 214 }
                      seed_keywords_processed: { type: integer, example: 2 }
                      pages_analyzed: { type: integer, example: 48 }
                      dataforseo:
                        type: object
                        description: DataForSEO keyword suggestions for up to 5 of the `seed_keywords`. All zeros when no seeds were sent.
                        properties:
                          suggestions_received: { type: integer, example: 20 }
                          suggestions_saved: { type: integer, example: 17 }
                          provider: { type: string, example: dataforseo }
                          sandbox: { type: boolean, example: false, description: True when using the DataForSEO sandbox (test data) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/SiteNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/keywords:
    get:
      tags: [Keywords]
      summary: List keywords (100 per page, by opportunity score)
      operationId: listKeywords
      description: API Resource collection with `data`, `links`, `meta`. No `success` key.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated keywords
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResourcePaginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Keyword' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/SiteNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/keywords/analyze:
    post:
      tags: [Keywords]
      summary: Run quality, scoring and clustering over all keywords
      operationId: analyzeKeywords
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Analysis summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      quality:
                        type: object
                        properties:
                          processed: { type: integer, example: 214 }
                          accepted: { type: integer, example: 180 }
                          rejected: { type: integer, example: 34 }
                      scoring:
                        type: object
                        properties:
                          processed: { type: integer, example: 180 }
                      clustering:
                        type: object
                        properties:
                          clusters: { type: integer, example: 22 }
                          keywords_updated: { type: integer, example: 180 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── TOPICAL MAPS ─────────────────────────────
  /sites/{site}/topical-map/build:
    post:
      tags: [Topical Maps]
      summary: Build (or rebuild) the topical map from keywords
      operationId: buildTopicalMap
      description: When the site has no usable keywords, `topical_map` is `null` and the counts are `0` (no `coverage_score`).
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Build result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      topical_map:
                        allOf: [{ $ref: '#/components/schemas/TopicalMap' }]
                        nullable: true
                      clusters: { type: integer, example: 14 }
                      keywords: { type: integer, example: 180 }
                      mapped_keywords: { type: integer, example: 122 }
                      coverage_score: { type: number, example: 67.78 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/topical-maps:
    get:
      tags: [Topical Maps]
      summary: List topical maps with their clusters
      operationId: listTopicalMaps
      description: Each cluster includes `targetPage` (crawl page or null) and `keywords_count`.
      parameters:

  # ───────────────────────────── SEARCH CONSOLE ─────────────────────────────
  /sites/{site}/search-console/connect:
    get:
      tags: [Search Console]
      summary: Get the Google OAuth URL
      operationId: gscConnect
      description: |
        Redirect the browser to `data.authorization_url`. After consent Google calls `GET /google/search-console/callback`,
        which redirects the browser to `{FRONTEND_URL}/settings/search-console?connected={site_id}`.
        `connected` holds the ID of the site that was connected, so read it to know which site to refresh. The authorization link expires after **15 minutes**.
        `FRONTEND_URL` defaults to `http://localhost:3000`.
        Then call `GET /properties` and `POST /property`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      authorization_url:
                        type: string
                        format: uri
                        example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...&state=...
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /google/search-console/callback:
    get:
      tags: [Search Console]
      summary: Google OAuth callback (called by Google, not the front end)
      operationId: gscCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Success. Redirects to `{FRONTEND_URL}/settings/search-console?connected={site_id}`
          headers:
            Location:
              schema: { type: string, example: 'https://app.example.com/settings/search-console?connected=1' }
        '400':
          description: Invalid or expired state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              examples:
                invalid: { value: { message: Invalid Google OAuth state. } }
                expired: { value: { message: Google OAuth request expired. } }
        '404':
          description: Site from the state no longer exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Site not found. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/search-console/properties:
    get:
      tags: [Search Console]
      summary: List Search Console properties available to the connected Google account
      operationId: gscProperties
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        property: { type: string, example: 'sc-domain:example.com' }
                        permission_level: { type: string, example: siteOwner }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404':
          description: Site not found, or Search Console is not connected for this site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: 'No query results for model [App\Modules\SearchConsole\Models\GoogleSearchConsoleConnection].' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/search-console/property:
    post:
      tags: [Search Console]
      summary: Select the Search Console property for this site
      operationId: gscSelectProperty
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property]
              properties:
                property: { type: string, maxLength: 500, example: 'sc-domain:example.com' }
      responses:
        '200':
          description: Property saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      property: { type: string, example: 'sc-domain:example.com' }
                      status: { type: string, example: connected }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422':
          description: Validation, property not owned by the Google account, or no workspace
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/FrameworkError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validation:
                  value: { message: The property field is required., errors: { property: [The property field is required.] } }
                notAvailable:
                  value: { message: The selected Search Console property is not available to this Google account. }
                noWorkspace:
                  value: { success: false, message: No active workspace found. }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/search-console/sync:
    post:
      tags: [Search Console]
      summary: Pull query and page data from Search Console
      operationId: gscSync
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date: { type: string, format: date, example: '2026-09-01' }
                end_date: { type: string, format: date, example: '2026-09-30' }
      responses:
        '200':
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      start_date: { type: string, format: date, example: '2026-09-01' }
                      end_date: { type: string, format: date, example: '2026-09-30' }
                      rows_received: { type: integer, example: 2500 }
                      rows_processed: { type: integer, example: 2500 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500':
          description: Not connected, no property selected, or Google API failure (unhandled exception)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Server Error }

  /sites/{site}/search-console/overview:
    get:
      tags: [Search Console]
      summary: Connection status, totals, and the latest 100 query rows
      operationId: gscOverview
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      connection:
                        allOf: [{ $ref: '#/components/schemas/GscConnection' }]
                        nullable: true
                      analytics:
                        type: object
                        description: Aggregates come straight from SQL and may be strings or numbers depending on the DB driver.
                        properties:
                          total_clicks: { oneOf: [{ type: number }, { type: string }], example: '1532' }
                          total_impressions: { oneOf: [{ type: number }, { type: string }], example: '48211' }
                          ctr: { oneOf: [{ type: number }, { type: string }], example: '0.0318' }
                          average_position: { oneOf: [{ type: number }, { type: string }], example: '18.42' }
                      queries:
                        type: array
                        items: { $ref: '#/components/schemas/GscQuery' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/opportunities/{opportunity}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: opportunity
        in: path
        required: true
        schema: { type: integer, example: 7 }
    get:
      tags: [SEO Opportunities]
      summary: Get one opportunity
      operationId: getOpportunity
      responses:
        '200':
          description: Opportunity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SeoOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [SEO Opportunities]
      summary: Update opportunity status
      operationId: updateOpportunity
      description: '`resolved_at` is set automatically when status becomes `completed` or `ignored`.'
      requestBody:
        required: true
        content:

      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SeoOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── CONTENT PLANNER ─────────────────────────────
  /sites/{site}/content-planner/generate:
    post:
      tags: [Content Planner]
      summary: Generate a monthly content plan and calendar items
      operationId: generateContentPlan
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
                timezone: { type: string, example: Africa/Lagos }
                articles_target: { type: integer, minimum: 1, maximum: 100, example: 12 }
                cadence: { type: string, enum: [daily, weekly, custom], example: weekly }
                publishing_days:
                  type: array
                  description: ISO weekdays (1 = Monday … 7 = Sunday)
                  items: { type: integer, minimum: 1, maximum: 7 }
                  example: [1, 3, 5]
                quiet_days:
                  type: array
                  items: { type: string, format: date }
                  example: ['2026-11-27']
                publish_time: { type: string, pattern: '^\d{2}:\d{2}$', example: '09:00' }
                autopilot_enabled: { type: boolean, example: false }
      responses:
        '200':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      plan:
                        allOf:
                          - $ref: '#/components/schemas/ContentPlan'
                      items_created: { type: integer, example: 12 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/content-plans:
    get:
      tags: [Content Planner]
      summary: List content plans with their items (20 per page)
      operationId: listContentPlans
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LaravelPaginator'
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/ContentPlan'
                                - type: object
                                  properties:
                                    items:
                                      type: array
                                      items: { $ref: '#/components/schemas/ContentCalendarItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/content-calendar:
    get:
      tags: [Content Planner]
      summary: List calendar items (100 per page, by date)
      operationId: listContentCalendar
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-11-30' }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated calendar items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LaravelPaginator'
                      - type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ContentCalendarItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/content-calendar/{item}/reschedule:
    patch:
      tags: [Content Planner]
      summary: Move a calendar item to a new date/time
      operationId: rescheduleCalendarItem
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CalendarItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_date]
              properties:
                scheduled_date: { type: string, format: date, example: '2026-11-14' }
                scheduled_time: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true, example: '10:30' }
      responses:
        '200': { $ref: '#/components/responses/CalendarItemResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/content-calendar/{item}/swap-keyword:
    patch:
      tags: [Content Planner]
      summary: Replace the keyword of a calendar item
      operationId: swapCalendarKeyword
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CalendarItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword_id]

                keyword_id: { type: integer, example: 42, description: Must exist and belong to this site }

        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/content-calendar/{item}/remove:
    patch:
      tags: [Content Planner]
      summary: Soft-remove a calendar item (status becomes `removed`)
      operationId: removeCalendarItem
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CalendarItemId'
      responses:
        '200': { $ref: '#/components/responses/CalendarItemResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── ARTICLE RESEARCH ─────────────────────────────
  /sites/{site}/articles/research/keywords/{keyword}:
    post:
      tags: [Article Research]
      summary: Create a research brief for a keyword
      operationId: researchKeyword
      description: Synchronous and can take a long time because it calls SERP and LLM providers.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: keyword
          in: path
          required: true
          description: Keyword ID
          schema: { type: integer, example: 42 }
      responses:
        '200':
          description: Research brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      research: { $ref: '#/components/schemas/ArticleResearchWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500':
          description: Keyword belongs to another site, or a provider failed (unhandled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Server Error }

  /sites/{site}/articles/research:
    get:
      tags: [Article Research]
      summary: List research briefs
      operationId: listResearch
      description: Note the paginator is nested at `data.research`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: status
          in: query
          schema: { type: string, example: completed }
        - name: keyword_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PerPage20'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated research briefs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      research:
                        allOf:
                          - $ref: '#/components/schemas/LaravelPaginator'
                          - type: object
                            properties:
                              data:
                                type: array
                                items: { $ref: '#/components/schemas/ArticleResearchWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/articles/research/{research}:
    get:
      tags: [Article Research]
      summary: Get one research brief (with keyword, crawl page and article)
      operationId: getResearch
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: research
          in: path
          required: true
          schema: { type: integer, example: 5 }
      responses:
        '200':
          description: Research brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      research: { $ref: '#/components/schemas/ArticleResearchWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── ARTICLES ─────────────────────────────
  /sites/{site}/articles/generate/{research}:
    post:
      tags: [Articles]
      summary: Generate (or regenerate) an article from a completed research brief
      operationId: generateArticle
      description: Synchronous LLM call and can be slow. Research must have `status = completed`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: research
          in: path
          required: true
          schema: { type: integer, example: 5 }
      responses:
        '200':
          description: Generated article
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      article: { $ref: '#/components/schemas/ArticleWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/AbortNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspaceAbort' }
        '500':
          description: Research not completed, has no keyword, or LLM failure (unhandled RuntimeException)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Server Error }

  /sites/{site}/articles:
    get:
      tags: [Articles]
      summary: List articles
      operationId: listArticles
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: status
          in: query
          schema: { type: string, example: draft }
        - name: keyword_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PerPage20'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated articles (with keyword, crawlPage, research)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LaravelPaginator'
                      - type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ArticleWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/AbortNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspaceAbort' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/articles/{article}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: article
        in: path
        required: true
        schema: { type: integer, example: 9 }
    get:
      tags: [Articles]
      summary: Get one article (revisions newest first)
      operationId: getArticle
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      article: { $ref: '#/components/schemas/ArticleWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/AbortNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspaceAbort' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Articles]
      summary: Save draft edits (creates a revision snapshot first)
      operationId: updateArticle
      description: |
        Send at least one field. When `title` changes and `slug` is omitted, the slug is regenerated.
        Articles with status `published` or `publishing` cannot be edited.
        When `content` is sent and the article has research, the backend rewrites internal links in the HTML and replaces `internal_links`.
        Re-render the editor from the returned `article.content` rather than from what you sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, maxLength: 255 }
                slug: { type: string, maxLength: 255, nullable: true }
                meta_title: { type: string, maxLength: 255, nullable: true }
                meta_description: { type: string, maxLength: 500, nullable: true }
                content: { type: string, description: HTML }
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Article draft saved. }
                  data:
                    type: object
                    properties:
                      article: { $ref: '#/components/schemas/ArticleWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/AbortNotFound' }
        '422':
          description: Validation, locked status, empty body, or no workspace
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/FrameworkError'
              examples:
                locked:
                  value:
                    message: This article cannot be edited through the draft endpoint in its current status.
                    errors: { status: [This article cannot be edited through the draft endpoint in its current status.] }
                empty:
                  value:
                    message: Provide at least one article field to update.
                    errors: { article: [Provide at least one article field to update.] }
                validation:
                  value:
                    message: The title field must not be greater than 255 characters.
                    errors: { title: [The title field must not be greater than 255 characters.] }
                noWorkspace:
                  value: { message: No active workspace found. }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── PUBLISHING ─────────────────────────────
  /sites/{site}/publishing/connections:
    get:
      tags: [Publishing]
      summary: List publishing connections (credentials are never returned)
      operationId: listPublishingConnections
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublishingConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Publishing]
      summary: Create a publishing connection
      operationId: createPublishingConnection
      description: |
        Required `credentials` / `config` keys depend on `platform` + `method` (only when `method = api`):

        | Platform | Required keys |
        |---|---|
        | wordpress | `credentials.site_url`, `credentials.username`, `credentials.application_password` |
        | shopify | `credentials.store_domain` (`*.myshopify.com`), `credentials.access_token`. Publishing also needs `config.blog_id` or `options.blog_id`, which you can get from `GET .../shopify-blogs`. |
        | webflow | `credentials.access_token`, `config.collection_id` |
        | wix | `credentials.access_token`, `credentials.site_id` |
        | ghost | `credentials.admin_api_key`, `config.site_url` |
        | wordpress_com | ❌ Not allowed here. Use the OAuth flow (`GET wordpress-com/authorize`). |

        `manual` connections are created as `active`. API connections are created as `pending`; call `/test` to activate them.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublishingConnectionRequest' }
            examples:
              wordpress:
                value:
                  name: Main blog
                  platform: wordpress
                  method: api
                  credentials: { site_url: 'https://blog.example.com', username: admin, application_password: 'abcd efgh ijkl mnop' }
              manual:
                value: { name: Copy & paste, platform: custom, method: manual }
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    enum:
                      - Manual publishing connection created.
                      - Connection created. Test the connection to activate it.
                  data: { $ref: '#/components/schemas/PublishingConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422':
          description: Validation, unsupported integration, WordPress.com, or no workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  value:
                    success: false
                    message: Validation failed.
                    errors:
                      credentials.site_url: [The credentials.site url field is required.]
                wordpressCom:
                  value:
                    success: false
                    message: Connect WordPress.com through OAuth instead of creating a manual connection.
                    authorization_endpoint: wordpress-com/authorize
                notAvailable:
                  value: { success: false, message: This publishing integration is not available yet. }
                noWorkspace:
                  value: { success: false, message: No active workspace found. }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/publishing/connections/{connection}/test:
    post:
      tags: [Publishing]
      summary: Test a connection (sets status to `active` or `error`)
      operationId: testPublishingConnection
      description: A **200** can still carry `success false` when the provider replied but rejected the credentials. Always check `success`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: connection
          in: path
          required: true
          schema: { type: integer, example: 4 }
      responses:
        '200':
          description: Provider test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      success: { type: boolean, example: true }
                      provider: { type: string, example: wordpress }
                      message: { type: string, example: WordPress connection verified. }
                      site_url: { type: string, example: 'https://blog.example.com' }
                      username: { type: string, nullable: true, example: admin }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Connection not found or belongs to another site
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/FrameworkError'
              examples:
                otherSite:
                  value: { success: false, message: Publishing connection does not belong to this site. }
                missing:
                  value: { message: 'No query results for model [App\Modules\Publishing\Models\PublishingConnection] 4' }
        '422':
          description: Provider threw an error (message is the provider error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: 'cURL error 28: Operation timed out' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/publishing/articles/{article}/publish:
    post:
      tags: [Publishing]
      summary: Publish an article through a connection
      operationId: publishArticle
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: article
          in: path
          required: true
          schema: { type: integer, example: 9 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id]
              properties:
                connection_id: { type: integer, example: 4 }
                options:
                  type: object
                  additionalProperties: true
                  description: Provider-specific options (for example `status draft|publish`)
      responses:
        '200':
          description: Published, or prepared for manual publishing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    enum:
                      - Article published successfully.
                      - Article prepared for manual publishing; no external publication occurred.
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Publication'
                      - type: object
                        properties:

              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
