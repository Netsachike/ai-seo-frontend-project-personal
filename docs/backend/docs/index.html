components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token from `POST /login` → `data.token`

  # ───────────────────────────── PARAMETERS ─────────────────────────────
  parameters:
    SiteId:
      name: site
      in: path
      required: true
      description: Site ID
      schema: { type: integer, example: 1 }
    Page:
      name: page
      in: query
      required: false
      description: Page number (1-based)
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage20:
      name: per_page
      in: query
      required: false
      description: Items per page (max 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CalendarItemId:
      name: item
      in: path
      required: true
      description: Content calendar item ID
      schema: { type: integer, example: 21 }
    IssueId:
      name: issue
      in: path
      required: true
      description: Site Guard issue ID
      schema: { type: integer, example: 31 }
    MoneyPageId:
      name: moneyPage
      in: path
      required: true
      description: Money page ID
      schema: { type: integer, example: 3 }

  # ───────────────────────────── REUSABLE RESPONSES ─────────────────────────────
  responses:
    Unauthenticated:
      description: Missing, invalid or revoked Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: Unauthenticated. }
    NoWorkspaceAvailable:
      description: The user does not belong to any workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: No workspace available. }
    NoActiveWorkspace:
      description: Active workspace could not be resolved
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: No active workspace found. }
    NoActiveWorkspaceAbort:
      description: Active workspace could not be resolved (framework abort format)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: No active workspace found. }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
          example:
            message: The email field is required. (and 1 more error)
            errors:
              email: [The email field is required.]
              password: [The password field is required.]
    ValidationOrWorkspace:
      description: Validation failed, or no active workspace
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorBody'
              - $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              summary: Validation failed
              value:
                message: The limit field must not be greater than 100.
                errors:
                  limit: [The limit field must not be greater than 100.]
            noWorkspace:
              summary: No active workspace
              value: { success: false, message: No active workspace found. }
    ModelNotFound:
      description: A path ID does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: 'No query results for model [App\Models\Site] 99' }
    SiteNotFound:
      description: Site does not exist or is not in the active workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: 'No query results for model [App\Models\Site].' }
    AbortNotFound:
      description: Resource missing or not in this site/workspace. A bare `abort(404)` gives an empty message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          examples:
            scoped: { value: { message: '' } }
            missing: { value: { message: 'No query results for model [App\Models\Article] 9' } }
    RuntimeError422:
      description: Business rule failure (message explains why)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: No fix proposal exists for this issue. Generate a proposal first. }
    FreeToolError:
      description: Validation failed, or the tool threw an error
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorBody'
              - $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value: { message: The url field must be a valid URL., errors: { url: [The url field must be a valid URL.] } }
            toolError:
              value: { success: false, message: 'cURL error 6: Could not resolve host: example.invalid' }
    ServerError:
      description: Unhandled server error. With `APP_DEBUG=true` the body also contains `exception`, `file`, `line`, `trace`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: Server Error }
    SiteAccessNotFound:
      description: Site does not exist, or it is not in any of the user's workspaces (bare `abort(404)`, empty message)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          examples:
            noAccess: { value: { message: '' } }
            missing: { value: { message: 'No query results for model [App\Models\Site] 99' } }
    SiteHasNoTarget:
      description: The site has neither a domain nor a URL
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
          example: { message: This site has no configured domain or URL., errors: { site: [This site has no configured domain or URL.] } }
    StatusValidationError:
      description: Validation failed (`status` envelope used by the account, team, reseller and admin modules)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StatusEnvelope' }
          example:
            status: error
            message: Validation failed
            errors:
              email: [The email has already been taken.]
    StatusServerError:
      description: Unexpected error caught by the controller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StatusEnvelope' }
          example: { status: error, message: Unable to complete request }
    AdminForbidden:
      description: Logged in, but role is not admin or support
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          example: { message: Unauthorized. Admin or Support only. }
    CalendarItemResponse:
      description: Updated calendar item
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: { $ref: '#/components/schemas/ContentCalendarItem' }

  # ───────────────────────────── SCHEMAS ─────────────────────────────
  schemas:
    # ---- Envelopes ----
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Success }
        data: { nullable: true }
    ErrorEnvelope:
      type: object
      additionalProperties: true
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Something went wrong. }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: array, items: { type: string } }
    FrameworkError:
      type: object
      properties:
        message: { type: string, example: Server Error }
    ValidationErrorBody:
      type: object
      properties:
        message: { type: string, example: The given data was invalid. }
        errors:
          type: object
          description: Field name → list of messages. Nested fields use dot notation (`credentials.site_url`).
          additionalProperties: { type: array, items: { type: string } }
    LaravelPaginator:
      type: object
      description: Standard Laravel `LengthAwarePaginator` JSON
      properties:
        current_page: { type: integer, example: 1 }
        data: { type: array, items: {} }
        first_page_url: { type: string, example: 'http://127.0.0.1:8001/api/sites/1/opportunities?page=1' }
        from: { type: integer, nullable: true, example: 1 }
        last_page: { type: integer, example: 3 }
        last_page_url: { type: string, example: 'http://127.0.0.1:8001/api/sites/1/opportunities?page=3' }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string, example: '1' }
              active: { type: boolean }
        next_page_url: { type: string, nullable: true }
        path: { type: string, example: 'http://127.0.0.1:8001/api/sites/1/opportunities' }
        per_page: { type: integer, example: 50 }
        prev_page_url: { type: string, nullable: true }
        to: { type: integer, nullable: true, example: 50 }
        total: { type: integer, example: 128 }
    ResourcePaginated:
      type: object
      description: Laravel API Resource collection built from a paginator
      properties:
        data: { type: array, items: {} }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer, example: 1 }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            links: { type: array, items: { type: object, additionalProperties: true } }
            path: { type: string }
            per_page: { type: integer, example: 100 }
            to: { type: integer, nullable: true }
            total: { type: integer }
    PrioritySummary:
      type: object
      properties:
        total: { type: integer, example: 34 }
        critical: { type: integer, example: 2 }
        high: { type: integer, example: 9 }
        medium: { type: integer, example: 15 }
        low: { type: integer, example: 8 }
    RecommendationSummary:
      type: object
      properties:
        total_recommendations: { type: integer, example: 7 }
        critical: { type: integer, example: 0 }
        high: { type: integer, example: 3 }
        medium: { type: integer, example: 3 }
        low: { type: integer, example: 1 }
    Recommendation:
      type: object
      additionalProperties: true
      properties:
        type: { type: string, example: keyword_targeting }
        priority: { type: string, enum: [critical, high, medium, low] }
        title: { type: string, example: Choose a primary keyword }
        description: { type: string }
        recommended_action: { type: string }
        action: { type: string, example: assign_primary_keyword }
        data: { type: object, additionalProperties: true }
    FixProposal:
      type: object
      properties:
        success: { type: boolean, example: true }
        issue_id: { type: integer, example: 31 }
        field: { type: string, enum: [canonical, meta_description] }
        proposed_value: { type: string, example: 'Expert technical SEO audits for growing SaaS teams.' }
        canonical_url: { type: string, description: Only for `canonical` fixes }
        character_count: { type: integer, description: Only for `meta_description` fixes, example: 52 }
        status: { type: string, example: awaiting_manual_deployment }
        instructions: { type: array, items: { type: string }, description: Only for `canonical` fixes }
        message: { type: string }
    McpToolName:
      type: string
      enum:
        - analyze_keywords
        - analyze_money_pages
        - analyze_opportunities
        - analyze_site_guard
        - generate_content_plan
        - get_ai_visibility
        - get_articles
        - get_authority
        - get_competitors
        - get_content_gaps
        - get_content_plan
        - get_keywords
        - get_money_pages
        - get_seo_opportunities
        - get_site_guard
        - get_site_overview
        - test_ai_visibility
    PlatformEnum:
      type: string
      enum: [wordpress, wordpress_com, shopify, wix, webflow, ghost, duda, nextjs, lovable, replit, custom, unknown]

    # ---- Requests ----
    CreateSiteRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 255, example: Example Inc }
        url: { type: string, format: uri, maxLength: 2048, example: 'https://example.com' }
        business_name: { type: string, maxLength: 255, nullable: true }
        industry: { type: string, maxLength: 255, nullable: true, example: Marketing }
        country: { type: string, maxLength: 100, nullable: true, example: US }
        state: { type: string, maxLength: 100, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        language: { type: string, maxLength: 20, nullable: true, example: en }
        platform: { $ref: '#/components/schemas/PlatformEnum' }
        description: { type: string, nullable: true }
        target_audience: { type: array, nullable: true, items: { type: string, maxLength: 255 } }
        services: { type: array, nullable: true, items: { type: string, maxLength: 255 } }
        target_locations: { type: array, nullable: true, items: { type: string, maxLength: 255 } }
        brand_voice: { type: string, maxLength: 1000, nullable: true }
    CreatePublishingConnectionRequest:
      type: object
      required: [name, platform, method]
      properties:
        name: { type: string, maxLength: 255 }
        platform: { type: string, enum: [wordpress, wordpress_com, wix, shopify, webflow, ghost, duda, nextjs, custom] }
        method: { type: string, enum: [api, webhook, manual] }
        credentials:
          type: object
          nullable: true
          properties:
            site_url: { type: string, format: uri }
            username: { type: string }
            application_password: { type: string }
            store_domain: { type: string, example: my-store.myshopify.com }
            access_token: { type: string, maxLength: 2048 }
            site_id: { type: string }
            admin_api_key: { type: string }
        config:
          type: object
          nullable: true
          properties:
            collection_id: { type: string }
            site_url: { type: string, format: uri }
            blog_id: { type: string }
            author_name: { type: string }
            field_mapping:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                slug: { type: string }
                meta_description: { type: string }
    SchemaGeneratorRequest:
      type: object
      required: [type, data]
      properties:
        type: { type: string, enum: [article, faq, local_business, organization, product, service] }
        data:
          type: object
          properties:
            headline: { type: string, maxLength: 300 }
            name: { type: string, maxLength: 300 }
            description: { type: string, maxLength: 5000 }
            url: { type: string, format: uri }
            image: { type: string, format: uri }
            logo: { type: string, format: uri }
            telephone: { type: string, maxLength: 50 }
            author: { type: string, maxLength: 300 }
            publisher: { type: string, maxLength: 300 }
            brand: { type: string, maxLength: 300 }
            provider: { type: string, maxLength: 300 }
            questions:
              type: array
              maxItems: 100
              items:
                type: object
                required: [question, answer]
                properties:
                  question: { type: string, maxLength: 1000 }
                  answer: { type: string, maxLength: 5000 }
            same_as: { type: array, maxItems: 50, items: { type: string, format: uri } }
            address:
              type: object
              properties:
                street: { type: string }
                city: { type: string }
                region: { type: string }
                postal_code: { type: string }
                country: { type: string }
            geo:
              type: object
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
            price: { type: number, minimum: 0 }
            currency: { type: string, minLength: 3, maxLength: 3, example: USD }
            availability: { type: string }
            sku: { type: string }
            service_type: { type: string }
            area_served: { type: string }
            price_range: { type: string, example: $$ }
            date_published: { type: string, format: date }
            date_modified: { type: string, format: date }

    # ---- Auth ----
    User:
      type: object
      description: UserResource (used by `/me`)
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Jane Doe }
        email: { type: string, example: jane@example.com }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    LoginUser:
      type: object
      description: Full User model returned by `/login` (raw model plus computed attributes). `password` and `remember_token` are hidden.
      additionalProperties: true
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Jane Doe }
        email: { type: string, example: jane@example.com }
        email_verified_at: { type: string, format: date-time, nullable: true }
        role: { type: string, example: member }
        is_active: { nullable: true }
        token_balance: { nullable: true }
        tour_completed: { nullable: true }
        edit_access: { nullable: true }
        first_name: { type: string, nullable: true, example: Jane }
        last_name: { type: string, nullable: true, example: Doe }
        parsed_role: { nullable: true }
        user_workspaces: { type: array, items: { type: object, additionalProperties: true } }
        all_user_workspaces: { type: array, items: { type: object, additionalProperties: true } }
        active_workspace: { type: object, nullable: true, additionalProperties: true }
        subscriptions: { nullable: true }
        account_officer: { nullable: true }
        license_key: { nullable: true }
        user_xavi_credit: { nullable: true }
        user_integration: { nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Sites ----
    Site:
      type: object
      description: SiteResource
      properties:
        id: { type: integer, example: 1 }
        workspace_id: { type: integer, example: 1 }
        user_id: { type: integer, example: 1 }
        name: { type: string, example: Example Inc }
        domain: { type: string, example: example.com }
        url: { type: string, example: 'https://example.com' }
        business_name: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        location:
          type: object
          properties:
            country: { type: string, nullable: true }
            state: { type: string, nullable: true }
            city: { type: string, nullable: true }
        language: { type: string, nullable: true, example: en }
        platform:
          type: object
          properties:
            name: { type: string, example: wordpress }
            detected: { type: boolean, example: true }
            confidence: { type: number, nullable: true, example: 0.92 }
        publishing:
          type: object
          properties:
            method: { type: string, nullable: true, example: api }
        settings:
          type: object
          description: Present only when settings are loaded (show/create/platform endpoints)
          properties:
            description: { type: string, nullable: true }
            target_audience: { type: array, items: { type: string } }
            services: { type: array, items: { type: string } }
            target_locations: { type: array, items: { type: string } }
            brand_voice: { type: string, nullable: true }
            seo_enabled: { type: boolean }
            ai_visibility_enabled: { type: boolean }
        status: { type: string, example: active }
        last_crawled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Crawler ----
    CrawlRun:
      type: object
      properties:
        id: { type: integer, example: 12 }
        site_id: { type: integer, example: 1 }
        workspace_id: { type: integer, example: 1 }
        status: { type: string, enum: [pending, running, completed, failed], example: running }
        max_pages: { type: integer, example: 100 }
        respect_robots: { type: boolean, example: true }
        crawl_delay_ms: { type: integer, example: 0 }
        pages_discovered: { type: integer, example: 64 }
        pages_crawled: { type: integer, example: 40 }
        pages_failed: { type: integer, example: 1 }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CrawlPage:
      type: object
      description: CrawlPageResource
      properties:
        id: { type: integer, example: 44 }
        crawl_run_id: { type: integer }
        site_id: { type: integer }
        url: { type: string, example: 'https://example.com/services' }
        status_code: { type: integer, nullable: true, example: 200 }
        content_type: { type: string, nullable: true, example: text/html }
        title: { type: string, nullable: true }
        meta_description: { type: string, nullable: true }
        h1: { type: string, nullable: true }
        content: { type: string, nullable: true, description: Raw HTML }
        content_text: { type: string, nullable: true }
        content_summary: { type: string, nullable: true }
        page_type: { type: string, nullable: true, example: service }
        word_count: { type: integer, nullable: true }
        internal_links_count: { type: integer, nullable: true }
        external_links_count: { type: integer, nullable: true }
        indexable: { type: boolean, nullable: true }
        canonical_url: { type: string, nullable: true }
        headings: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        images: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        schema_types: { type: array, nullable: true, items: { type: string } }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CrawlPageModel:
      description: Raw crawl page model when embedded as a relation (same fields as CrawlPage plus workspace_id and url_hash)
      allOf:
        - $ref: '#/components/schemas/CrawlPage'
        - type: object
          properties:
            workspace_id: { type: integer }
            url_hash: { type: string }

    # ---- Keywords ----
    Keyword:
      type: object
      description: KeywordResource (used by `GET /sites/{site}/keywords`)
      properties:
        id: { type: integer, example: 42 }
        site_id: { type: integer, example: 1 }
        keyword: { type: string, example: seo audit service }
        language: { type: string, nullable: true, example: en }
        location:
          type: object
          properties:
            country: { type: string, nullable: true }
            city: { type: string, nullable: true }
        search_surface: { type: string, nullable: true, example: google }
        status: { type: string, nullable: true }
        signals:
          type: object
          properties:
            branded: { type: boolean }
            local: { type: boolean }
            question: { type: boolean }
            word_count: { type: integer, nullable: true }
        metrics:
          type: object
          properties:
            search_volume: { type: integer, nullable: true, example: 880 }
            keyword_difficulty: { type: string, nullable: true, example: '34.00' }
            cpc: { type: string, nullable: true, example: '4.20' }
            opportunity_score: { type: string, nullable: true, example: '72.50' }
        quality:
          type: object
          properties:
            status: { type: string, nullable: true, example: accepted }
            quality_score: { type: string, nullable: true, example: '81.00' }
            relevance_score: { type: string, nullable: true, example: '77.00' }
            rejection_reason: { type: string, nullable: true }
        scoring:
          type: object
          properties:
            opportunity_score: { type: string, nullable: true, example: '72.50' }
            scored_at: { type: string, format: date-time, nullable: true }
        intent: { type: string, nullable: true, example: commercial }
        cluster: { type: string, nullable: true, example: seo audit }
        target_page: { type: integer, nullable: true, description: Crawl page ID }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KeywordModel:
      type: object
      description: Raw keyword model when embedded as a relation (flat columns, decimals as strings)
      properties:
        id: { type: integer }
        site_id: { type: integer }
        keyword: { type: string }
        keyword_hash: { type: string }
        language: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        search_surface: { type: string, nullable: true }
        status: { type: string, nullable: true }
        is_branded: { type: boolean }
        is_local: { type: boolean }
        is_question: { type: boolean }
        word_count: { type: integer, nullable: true }
        search_volume: { type: integer, nullable: true }
        keyword_difficulty: { type: string, nullable: true }
        cpc: { type: string, nullable: true }
        opportunity_score: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        cluster_name: { type: string, nullable: true }
        target_page_id: { type: integer, nullable: true }
        relevance_score: { type: string, nullable: true }
        quality_score: { type: string, nullable: true }
        quality_status: { type: string, nullable: true }
        rejection_reason: { type: string, nullable: true }
        scored_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Topical maps ----
    TopicalMap:
      type: object
      properties:
        id: { type: integer, example: 3 }
        site_id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string, example: Example Inc topical map }
        description: { type: string, nullable: true }
        status: { type: string, example: completed }
        core_topics_count: { type: integer }
        clusters_count: { type: integer }
        keywords_count: { type: integer }
        mapped_keywords_count: { type: integer }
        coverage_score: { type: string, example: '67.78' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TopicalCluster:
      type: object
      properties:
        id: { type: integer }
        topical_map_id: { type: integer }
        name: { type: string, example: Technical SEO }
        core_topic: { type: string, nullable: true }
        strategy: { type: string, nullable: true }
        keyword_count: { type: integer }
        mapped_keyword_count: { type: integer }
        coverage_score: { type: string, example: '55.00' }

        target: { type: string, example: example.com }
        total_count: { type: integer, nullable: true, example: 214 }
        items_count: { type: integer, example: 20 }
        items:
          type: array
          items: { $ref: '#/components/schemas/BacklinkItem' }
        provider: { type: string, example: dataforseo }
        sandbox: { type: boolean, example: false }
        api_cost_usd: { type: number, nullable: true, example: 0.02 }
        retrieved_at: { type: string, format: date-time }

    # ---- Workspaces, team, admin ----
    StatusEnvelope:
      type: object
      description: Envelope used by the account, workspace, team, reseller and admin modules
      additionalProperties: true
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    WorkSpace:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Client A }
        description: { type: string, nullable: true }
        logo: { type: string, nullable: true, example: 'https://bucket.s3.amazonaws.com/Vg/images/logo.png' }
        user_id: { type: integer, description: Owner }
        slug: { type: string, example: client-a }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserWorkSpace:
      type: object
      description: Membership of a user in a workspace
      properties:
        id: { type: integer }
        user_id: { type: integer }
        work_space_id: { type: integer }
        role: { type: string, example: super_admin, description: 'super_admin, admin or manager' }
        is_active: { type: boolean, description: True for the workspace currently in use }
        user_role: { nullable: true }
        user_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWorkspaceRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 255, example: Client A }
        slug: { type: string, maxLength: 255, example: client-a, description: Unique across all workspaces }
        is_default: { type: boolean, nullable: true }
    TeamMemberInput:
      type: object
      required: [first_name, last_name, email, role, user_access]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        role: { type: string, enum: [admin_team_member, team_member, client_member] }
        user_access:
          type: array
          items:
            type: object
            required: [id, has_access]
            properties:
              id: { type: integer, description: Workspace ID }
              has_access: { type: boolean }
    PlanEnum:
      type: string
      enum: [free, professional, agency, enterprise, reseller]
    AddonsInput:
      type: object
      nullable: true
      description: Keyed by add-on name
      additionalProperties:
        type: object
        properties:
          status: { type: boolean, default: true }
          type: { type: string, default: lifetime }
          limit: { type: integer, nullable: true }
          start_date: { type: string, nullable: true }
          end_date: { type: string, nullable: true }
      example: { ai_credits: { status: true, type: monthly, limit: 5000 } }

    # ---- Copilot ----
    CopilotConversation:
      type: object
      properties:
        id: { type: integer, example: 4 }
        workspace_id: { type: integer, nullable: true }
        site_id: { type: integer }
        user_id: { type: integer, nullable: true }
        title: { type: string, nullable: true }
        status: { type: string, nullable: true, example: active }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        context: { type: object, nullable: true, additionalProperties: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        last_message_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CopilotMessage:
      type: object
      properties:
        id: { type: integer }
        conversation_id: { type: integer }
        workspace_id: { type: integer, nullable: true }
        site_id: { type: integer }
        user_id: { type: integer, nullable: true }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        context: { type: object, nullable: true, additionalProperties: true }
        actions: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        input_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        total_tokens: { type: integer, nullable: true }
        response_time_ms: { type: integer, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
</script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const spec = jsyaml.load(document.getElementById('openapi-spec').textContent);
    window.ui = SwaggerUIBundle({
      spec,
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'none',
      defaultModelsExpandDepth: 0,
      defaultModelExpandDepth: 3,
      displayRequestDuration: true,
      filter: true,
      persistAuthorization: true,
      tryItOutEnabled: false,
    });
  </script>
</body>
</html>
