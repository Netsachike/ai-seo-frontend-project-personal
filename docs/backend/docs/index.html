  /sites/{site}/publishing/wordpress-com/authorize:
    get:
      tags: [Publishing]
      summary: Start WordPress.com OAuth (step 1 of 3)
      operationId: wpcomAuthorize
      description: |
        **Flow**
        1. Call this endpoint and redirect the browser to `authorization_url` (valid for 10 minutes).
        2. WordPress.com redirects to `GET /publishing/wordpress-com/callback`, which redirects the browser to `{FRONTEND_URL}/settings/wordpress-com?connected=pending&pending_key=…` (⚠️ currently returns 500, see the callback).
        3. On that page, call `POST /sites/{site}/publishing/wordpress-com/complete` with `pending_key` and the chosen `wordpress_site_id`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Authorization URL (note that there is no `data` wrapper)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  authorization_url: { type: string, format: uri, example: 'https://public-api.wordpress.com/oauth2/authorize?client_id=123&redirect_uri=...&response_type=code&scope=global&state=...' }
                  expires_in: { type: integer, example: 600 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Site is not in the active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: The selected site is not available in your active workspace. }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500':
          description: OAuth not configured on the server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: WordPress.com OAuth is not configured. }

  /sites/{site}/publishing/wordpress-com/complete:
    post:
      tags: [Publishing]
      summary: Finish WordPress.com OAuth by choosing a site (step 3 of 3)
      operationId: wpcomComplete
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pending_key, wordpress_site_id]
              properties:
                pending_key: { type: string, minLength: 32, maxLength: 128 }
                wordpress_site_id: { type: string, maxLength: 255, example: '123456789' }
                name: { type: string, maxLength: 255, nullable: true, example: My WP.com blog }
      responses:
        '201':
          description: Connection created (status `pending`; call `/test` next)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: WordPress.com site connected. Test the connection to activate it. }
                  data: { $ref: '#/components/schemas/PublishingConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Site or authorization does not belong to the current user/workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                site: { value: { success: false, message: The selected site is not available in your active workspace. } }
                owner: { value: { success: false, message: 'This authorization does not belong to the current user, workspace, and site.' } }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422':
          description: Validation, expired key, or unknown WordPress.com site
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                expired: { value: { success: false, message: The authorization has expired or has already been used. Please reconnect WordPress.com. } }
                unknownSite: { value: { success: false, message: The selected WordPress.com site was not authorized. } }
                noToken: { value: { success: false, message: The authorization token is missing. Please reconnect WordPress.com. } }
                validation: { value: { message: The pending key field is required., errors: { pending_key: [The pending key field is required.] } } }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── PUBLISHING OAUTH & WEBHOOKS (public) ─────────────────────────
  /publishing/wordpress-com/callback:
    get:
      tags: [Publishing OAuth & Webhooks]
      summary: WordPress.com OAuth redirect target (step 2 of 3)
      operationId: wpcomCallback
      security: []
      description: |
        WordPress.com sends the browser here after consent. On success the backend now **redirects the browser** (302) to the frontend instead of returning JSON:
        `{FRONTEND_URL}/settings/wordpress-com?connected=pending&pending_key=<key>&sites_id=<…>`
        The `/settings/wordpress-com` page should read `pending_key` from the query string and call `POST /sites/{site}/publishing/wordpress-com/complete` within 10 minutes.

        ⚠️ **Currently broken after a successful token exchange.** The redirect builds `sites_id` from `$sites->id`, but `$sites` is a list of sites, not one site. That throws, the generic handler catches it, and the browser gets **500** `An unexpected error occurred during WordPress.com authorization.` (as JSON, not a redirect).
        ⚠️ The site list is no longer returned anywhere, so the frontend has no way to show which WordPress.com site to pick for `wordpress_site_id` in `/complete`. The backend needs to either put the site list on the redirect or add an endpoint that returns it for a `pending_key`.
        Error cases (400/403/500/502) still return JSON.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Intended success. Redirects to the frontend settings page (not reachable until the bug above is fixed).
          headers:
            Location:
              schema:
                type: string
                example: 'https://app.rankoya.uk/settings/wordpress-com?connected=pending&pending_key=3sK9...64chars&sites_id=123456789'
        '400':
          description: Missing code or state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: The WordPress.com callback is missing code or state. }
        '403':
          description: Invalid, expired or reused state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: 'The OAuth state is invalid, expired, or already used.' }
        '500':
          description: Not configured or unexpected error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                config: { value: { success: false, message: WordPress.com OAuth is not configured. } }
                unexpected: { value: { success: false, message: An unexpected error occurred during WordPress.com authorization. } }
        '502':
          description: WordPress.com API failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                token: { value: { success: false, message: WordPress.com authorization could not be completed. } }
                noToken: { value: { success: false, message: WordPress.com did not return an access token. } }
                sites: { value: { success: false, message: Unable to retrieve WordPress.com sites. } }

  /publishing/wix/callback:
    get:
      tags: [Publishing OAuth & Webhooks]
      summary: Wix OAuth redirect (not implemented)
      operationId: wixCallback
      security: []
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: The redirect callback is not implemented. }

  /publishing/wix/webhook:
    post:
      tags: [Publishing OAuth & Webhooks]
      summary: Wix webhook receiver (called by Wix)
      operationId: wixWebhook
      security: []
      requestBody:
        required: true
        description: Raw RS256-signed JWT sent by Wix
        content:
          text/plain:
            schema: { type: string, example: eyJhbGciOiJSUzI1NiJ9.eyJkYXRhIjoi...In0.c2lnbmF0dXJl }
      responses:
        '200':
          description: Verified webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  event_type: { type: string, example: AppInstalled }
                  instance_id: { type: string, example: 7c9f0c1e-1111-2222-3333-444455556666 }
        '400':
          description: Malformed token or payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                format: { value: { success: false, message: Invalid webhook token format. } }
                noData: { value: { success: false, message: Webhook payload is missing event data. } }
                fields: { value: { success: false, message: Webhook payload is missing required fields. } }
        '401':
          description: Bad signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: Webhook signature verification failed. }
        '500':
          description: Public key not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, message: Webhook verification is not configured. }

                    oneOf:

                        additionalProperties: { type: string }

                  data:

      requestBody:

              schema:

                noWorkspace: { value: { success: false, message: No active workspace found. } }

        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/money-pages/{moneyPage}:
    get:
      tags: [Money Pages]
      summary: Get one money page
      operationId: getMoneyPage
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/MoneyPageId'
      responses:
        '200':
          description: Money page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/MoneyPageWithRelations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/money-pages/{moneyPage}/recommendations:
    get:
      tags: [Money Pages]
      summary: Optimization recommendations for a money page
      operationId: moneyPageRecommendations
      description: '⚠️ Returned **without** the `success` / `data` envelope.'
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/MoneyPageId'
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  money_page:
                    type: object
                    properties:
                      id: { type: integer, example: 3 }
                      site_id: { type: integer, example: 1 }
                      crawl_page_id: { type: integer, example: 44 }
                      name: { type: string, example: SEO Audit Service }
                      page_role: { type: string, example: service }
                      intent: { type: string, example: transactional }
                      commercial_score: { type: string, example: '86.50' }
                      url: { type: string, nullable: true, example: 'https://example.com/seo-audit' }
                      primary_keyword: { type: string, nullable: true, example: seo audit service }
                  summary: { $ref: '#/components/schemas/RecommendationSummary' }
                  workflow:
                    type: array
                    items: { type: string }
                    example: [fix_technical_seo, optimize_content, optimize_metadata, strengthen_internal_links, create_supporting_content, improve_ai_visibility, optimize_conversion, publish, measure, retest_ai_visibility]
                  recommendations:
                    type: array
                    items: { $ref: '#/components/schemas/Recommendation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/NoActiveWorkspace' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── AUTHORITY ─────────────────────────────
  /sites/{site}/authority/analyze:
    post:
      tags: [Authority]
      summary: Build the authority profile and backlink opportunities
      operationId: authorityAnalyze
      description: |
        Requires a Bearer token, and the site must belong to one of the user's workspaces (otherwise **404**).
        The response is **not** wrapped in `success` / `data`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id: { type: integer, example: 1 }
                  profile: { $ref: '#/components/schemas/AuthorityProfile' }
                  summary:
                    type: object
                    properties:
                      opportunities: { type: integer, example: 12 }
                      high_priority: { type: integer, example: 3 }
                      medium_priority: { type: integer, example: 6 }
                      low_priority: { type: integer, example: 3 }
                      external_metrics_available: { type: boolean, example: false }
                  workflow:
                    type: array
                    items: { type: string }
                    example: [research_competitor_authority, identify_relevant_prospects, create_or_strengthen_content_assets, build_citations_and_entity_mentions, acquire_relevant_editorial_links, track_opportunity_status, measure_authority]
                  opportunities:
                    type: array
                    items: { $ref: '#/components/schemas/BacklinkOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/authority/profile:
    get:
      tags: [Authority]
      summary: Get the authority profile
      operationId: authorityProfile
      description: '`profile` is `null` until `analyze` or `backlinks/summary` has run. Not wrapped in `success` / `data`.'
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    allOf: [{ $ref: '#/components/schemas/AuthorityProfile' }]
                    nullable: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/authority/opportunities:
    get:
      tags: [Authority]
      summary: List backlink opportunities
      operationId: authorityOpportunities
      description: Returns a **bare Laravel paginator** with no `success` key. Sorted by `opportunity_score` desc.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PerPage20'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated opportunities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LaravelPaginator'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BacklinkOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/authority/opportunities/{opportunity}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: opportunity
        in: path
        required: true
        schema: { type: integer, example: 8 }
    get:
      tags: [Authority]
      summary: Get one backlink opportunity (with relations)
      operationId: authorityOpportunity
      responses:
        '200':
          description: Opportunity
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunity:
                    allOf:
                      - $ref: '#/components/schemas/BacklinkOpportunity'
                      - type: object
                        properties:
                          competitor:
                            allOf: [{ $ref: '#/components/schemas/Competitor' }]
                            nullable: true
                          crawl_page:
                            allOf: [{ $ref: '#/components/schemas/CrawlPageModel' }]
                            nullable: true
                          money_page:
                            allOf: [{ $ref: '#/components/schemas/MoneyPage' }]
                            nullable: true
                          keyword:
                            allOf: [{ $ref: '#/components/schemas/KeywordModel' }]
                            nullable: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Authority]
      summary: Update a backlink opportunity
      operationId: authorityUpdateOpportunity
      description: Setting `status` to `acquired` also sets `completed_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, researching, prospect, outreach, acquired, rejected] }
                priority: { type: string, enum: [high, medium, low] }
                source_url: { type: string, format: uri, nullable: true }
                anchor_suggestion: { type: string, maxLength: 255, nullable: true }
                metadata: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunity: { $ref: '#/components/schemas/BacklinkOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/authority/backlinks/summary:
    get:
      tags: [Authority]
      summary: Fetch live backlink metrics (DataForSEO) and save them to the profile
      operationId: authorityBacklinkSummary
      description: |
        Calls DataForSEO for the site's domain (or URL when there is no domain). Each call costs money (`api_cost_usd`).
        Saves `external_backlink_count`, `referring_domains`, `evidence.backlink_summary` and `metadata.backlink_*` on the authority profile, and sets `provider` to `dataforseo`.
        Response is **not** wrapped in `success` / `data`.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Summary and updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: '#/components/schemas/BacklinkSummary' }
                  profile: { $ref: '#/components/schemas/AuthorityProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '422': { $ref: '#/components/responses/SiteHasNoTarget' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: DataForSEO is not configured or returned an error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Unable to retrieve backlink metrics from the configured provider. }

  /sites/{site}/authority/backlinks:
    get:
      tags: [Authority]
      summary: List live backlinks pointing to the site (one per referring domain)
      operationId: authorityBacklinks
      description: Paged with `limit` + `offset` (no `page`). Use `backlinks.total_count` to build the pager. Each call costs money.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 20000, default: 0 }
      responses:
        '200':
          description: Backlinks
          content:
            application/json:
              schema:
                type: object
                properties:
                  backlinks: { $ref: '#/components/schemas/BacklinkList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '422':
          description: Invalid `limit`/`offset`, or the site has no domain/URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
              examples:
                validation:
                  value: { message: The limit field must not be greater than 100., errors: { limit: [The limit field must not be greater than 100.] } }
                noTarget:
                  value: { message: This site has no configured domain or URL., errors: { site: [This site has no configured domain or URL.] } }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: DataForSEO is not configured or returned an error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Unable to retrieve backlinks from the configured provider. }

  /sites/{site}/authority/backlink-prospects:
    post:
      tags: [Authority]
      summary: Turn a competitor's backlinks into outreach prospects
      operationId: authorityDiscoverBacklinkProspects
      description: |
        Fetches up to `limit` backlinks of `competitor_domain` and upserts each one as a `BacklinkOpportunity`
        (`type = competitor_backlink_prospect`, `status = prospect`, `priority = medium`, `opportunity_score = 0`).
        These are outreach candidates, **not** acquired links. Re-running for the same source and target updates the existing rows instead of duplicating them.
        Afterwards, refresh `GET /sites/{site}/authority/opportunities` to show them.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competitor_domain]
              properties:
                competitor_domain:
                  type: string
                  maxLength: 255
                  description: Bare domain or URL (`competitor.com`, `https://competitor.com/blog`)
                  example: competitor.com
                target_url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Page on **this** site (same host or a subdomain) to pitch. Defaults to the site's homepage.
                  example: 'https://example.com/seo-audit'
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Prospects processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Competitor backlink prospects processed. These are outreach candidates, not acquired backlinks.' }
                  competitor_domain: { type: string, example: competitor.com }
                  target_url: { type: string, example: 'https://example.com' }
                  processed: { type: integer, description: Rows created or updated, example: 18 }
                  provider_total_count: { type: integer, nullable: true, example: 1240 }
                  sandbox: { type: boolean, example: false }
                  api_cost_usd: { type: number, nullable: true, example: 0.02 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SiteAccessNotFound' }
        '422':
          description: Validation failed, target URL on another domain, or site has no domain/URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
              examples:
                required:
                  value: { message: The competitor domain field is required., errors: { competitor_domain: [The competitor domain field is required.] } }
                badDomain:
                  value: { message: The competitor domain field format is invalid., errors: { competitor_domain: [The competitor domain field format is invalid.] } }
                foreignTarget:
                  value: { message: The target URL must belong to this site., errors: { target_url: [The target URL must belong to this site.] } }
                noTarget:
                  value: { message: This site has no configured domain or URL., errors: { site: [This site has no configured domain or URL.] } }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: DataForSEO is not configured or returned an error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Unable to retrieve competitor backlinks from the configured provider. }

  # ───────────────────────────── COPILOT ─────────────────────────────
  /sites/{site}/copilot/ask:
    post:
      tags: [Copilot]
      summary: Ask the SEO copilot a question
      operationId: copilotAsk
      security: []
      description: |
        ⚠️ **No auth middleware is applied to the Copilot routes.** Send the Bearer token anyway. Without it the message is stored with `user_id = null`.
        Response is **not** wrapped. Pass the returned `conversation.id` as `conversation_id` to continue the thread.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 5000, example: Which pages should I optimize first? }
                conversation_id: { type: integer, nullable: true, example: 4 }
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/CopilotConversation' }
                  user_message: { $ref: '#/components/schemas/CopilotMessage' }
                  message: { $ref: '#/components/schemas/CopilotMessage' }
                  answer: { type: string, example: 'Start with /seo-audit. It has the highest commercial score but is missing a meta description…' }
                  actions:
                    type: array
                    items: { type: object, additionalProperties: true }
                  focus: { type: string, nullable: true, example: money_pages, description: 'Detected topic of the question. business_profile is used for "describe my website/business" questions.' }
                  provider: { type: string, example: openrouter }
                  model: { type: string, example: anthropic/claude-sonnet-4.5 }
                  usage:
                    type: object
                    additionalProperties: true
                    example: { prompt_tokens: 3120, completion_tokens: 410, total_tokens: 3530 }
        '404':
          description: Site or conversation (for this site) not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: 'No query results for model [App\Modules\Copilot\Models\CopilotConversation].' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: LLM provider failure or misconfiguration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Server Error }

  /sites/{site}/copilot/conversations:
    get:
      tags: [Copilot]
      summary: List conversations (bare paginator)
      operationId: copilotConversations
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PerPage20'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LaravelPaginator'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/CopilotConversation'
                            - type: object
                              properties:
                                messages_count: { type: integer, example: 6 }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sites/{site}/copilot/conversations/{conversation}:
    get:
      tags: [Copilot]
      summary: Get a conversation with all messages
      operationId: copilotConversation
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: conversation
          in: path
          required: true
          schema: { type: integer, example: 4 }
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    allOf:
                      - $ref: '#/components/schemas/CopilotConversation'
                      - type: object
                        properties:
                          messages:
                            type: array
                            items: { $ref: '#/components/schemas/CopilotMessage' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── MCP ─────────────────────────────
  /mcp/tools:
    get:
      tags: [MCP]
      summary: List available MCP tools and their input schemas
      operationId: mcpTools
      responses:
        '200':
          description: Tool definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { $ref: '#/components/schemas/McpToolName' }
                        description: { type: string, example: Return a summary of the site's SEO status. }
                        inputSchema:
                          type: object
                          additionalProperties: true
                          description: JSON Schema for `arguments`
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/ServerError' }

  /mcp/sites/{site}/call:
    post:
      tags: [MCP]
      summary: Execute an MCP tool against a site
      operationId: mcpCall
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { $ref: '#/components/schemas/McpToolName' }
                arguments: { type: object, additionalProperties: true, example: { limit: 10 } }
      responses:
        '200':
          description: Tool result (shape depends on the tool)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  tool: { type: string, example: get_site_overview }
                  site_id: { type: integer, example: 1 }
                  result: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '404': { $ref: '#/components/responses/ModelNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrWorkspace' }
        '500':
          description: Unknown tool name or tool failure (unhandled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameworkError' }
              example: { message: Server Error }

  # ───────────────────────────── FREE TOOLS (public) ─────────────────────────────
  /free-tools/robots-txt:
    post:
      tags: [Free Tools]
      summary: Fetch and parse a site's robots.txt
      operationId: freeRobotsTxt
      security: []
      description: '`data.success` is `false` (with HTTP 200) when robots.txt could not be fetched.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048, example: 'https://example.com' }
                user_agent: { type: string, maxLength: 255, default: '*', example: Googlebot }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      success: { type: boolean, example: true }
                      url: { type: string, example: 'https://example.com/robots.txt' }
                      status_code: { type: integer, example: 200 }
                      exists: { type: boolean, example: true }
                      message: { type: string, description: Only when `success` is false, example: robots.txt could not be retrieved. }
                      user_agent: { type: string, example: Googlebot }
                      size: { type: integer, example: 312 }
                      rules:
                        type: array
                        description: Groups that apply to the user agent
                        items:
                          type: object
                          properties:
                            user_agents: { type: array, items: { type: string }, example: ['*'] }
                            rules:
                              type: array
                              items:
                                type: object
                                properties:
                                  type: { type: string, example: disallow }
                                  path: { type: string, example: /admin }
                      sitemaps: { type: array, items: { type: string }, example: ['https://example.com/sitemap.xml'] }
                      content: { type: string, example: "User-agent: *\nDisallow: /admin" }
        '422': { $ref: '#/components/responses/FreeToolError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /free-tools/redirect-checker:
    post:
      tags: [Free Tools]
      summary: Follow and report a redirect chain
      operationId: freeRedirectChecker
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048, example: 'http://example.com' }
      responses:
        '200':
          description: Result (`data.success` is false for loops or too many redirects)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      success: { type: boolean, example: true }
                      url: { type: string, example: 'http://example.com' }
                      final_url: { type: string, example: 'https://www.example.com/' }
                      status_code: { type: integer, nullable: true, example: 200 }
                      status_text: { type: string, example: OK }
                      redirected: { type: boolean, example: true }
                      redirect_count: { type: integer, example: 2 }
                      redirect_loop: { type: boolean, example: false }
                      too_many_redirects: { type: boolean, example: false }
                      message: { type: string, description: Only when a redirect had no Location header }
                      chain:
                        type: array
                        items:
                          type: object
                          properties:
                            url: { type: string, example: 'http://example.com' }
                            status_code: { type: integer, example: 301 }
                            status_text: { type: string, example: Moved Permanently }
                            redirect: { type: boolean, example: true }
                            location: { type: string, nullable: true, example: 'https://example.com/' }
                            duration_ms: { type: integer, example: 143 }
        '422': { $ref: '#/components/responses/FreeToolError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /free-tools/meta-tags:
    post:
      tags: [Free Tools]
      summary: Audit a page's meta tags
      operationId: freeMetaTags
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048, example: 'https://example.com' }
      responses:
        '200':
          description: Result (`data.success` is false when the page returned an error status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      success: { type: boolean, example: true }
                      url: { type: string }
                      final_url: { type: string }
                      status_code: { type: integer, example: 200 }
                      status_text: { type: string, example: OK }
                      message: { type: string, description: Only when `success` is false }
                      title:
                        type: object
                        properties:
                          value: { type: string, nullable: true, example: Example Domain }
                          present: { type: boolean }
                          length: { type: integer, example: 14 }
                      description:
                        type: object
                        properties:
                          value: { type: string, nullable: true }
                          present: { type: boolean }
                          length: { type: integer }
                      canonical:
                        type: object
                        properties:
                          value: { type: string, nullable: true }
                          present: { type: boolean }
                      robots:
                        type: object
                        properties:
                          value: { type: string, nullable: true, example: 'index, follow' }
                          indexable: { type: boolean }
                          followable: { type: boolean }
                      viewport:
                        type: object
                        properties:
                          value: { type: string, nullable: true }
                          present: { type: boolean }
                      headings:
                        type: object
                        properties:
                          h1_count: { type: integer, example: 1 }
                          h1s: { type: array, items: { type: string } }
                      open_graph: { type: object, additionalProperties: { type: string, nullable: true }, example: { title: Example, description: null, image: null } }
                      twitter: { type: object, additionalProperties: { type: string, nullable: true }, example: { card: summary_large_image } }
                      html:
                        type: object
                        properties:
                          lang: { type: string, nullable: true, example: en }
                          charset: { type: string, nullable: true, example: utf-8 }
                      checks:
                        type: object
                        additionalProperties: { type: boolean }
                        example: { title_present: true, description_present: false, canonical_present: true, robots_present: false, viewport_present: true, h1_present: true, single_h1: true, og_title_present: true, og_description_present: false, og_image_present: false, twitter_card_present: false }
        '422': { $ref: '#/components/responses/FreeToolError' }
        '500': { $ref: '#/components/responses/ServerError' }

                      links_found: { type: integer, example: 42 }
                      broken_links: { type: integer, example: 2 }

                            status_text: { type: string, example: Not Found }
                            broken: { type: boolean, example: true }
                            redirected: { type: boolean, example: false }
                            duration_ms: { type: integer, example: 210 }

  /free-tools/keyword-clustering:

  /free-tools/schema-generator:

  # ───────────────────────────── WORKSPACES ─────────────────────────────
  /workspace:
    get:
      tags: [Workspaces]
      summary: Current workspace and every workspace the user can access
      operationId: listWorkspaces
      description: 'Uses the `status` envelope (`"status": "success"`), not `success: true`.'
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  currentWorkspace:
                    allOf: [{ $ref: '#/components/schemas/WorkSpace' }]
                    nullable: true
                  userWorkspaces:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/UserWorkSpace'
                        - type: object
                          properties:
                            workspace: { $ref: '#/components/schemas/WorkSpace' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '500':
          description: Unexpected error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: error, message: Something went wrong. Please try again later. }

  /workspace/store:
    post:
      tags: [Workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      description: |
        Send `multipart/form-data` when uploading a `logo` (stored on S3). Otherwise JSON is fine.
        When `is_default` is true, the user's other workspaces lose their default flag.
        The new workspace is **not** activated. Call `POST /workspaces/{workspace}` to switch to it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateWorkspaceRequest'
                - type: object
                  properties:
                    logo: { type: string, format: binary, description: 'jpg/jpeg/png, max 2 MB' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  workspace: { $ref: '#/components/schemas/WorkSpace' }
                  message: { type: string, example: Workspace created successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '422':
          description: Validation failed (framework format)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorBody' }
              example: { message: The slug has already been taken., errors: { slug: [The slug has already been taken.] } }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspace/update:
    post:
      tags: [Workspaces]
      summary: Rename a workspace or change its slug/default flag
      operationId: updateWorkspace
      description: ⚠️ The backend does not check that the caller owns the workspace `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, slug]
              properties:
                id: { type: integer, example: 3 }
                name: { type: string, maxLength: 255, example: Client A }
                slug: { type: string, maxLength: 255, example: client-a, description: Unique across all workspaces }
                is_default: { type: boolean, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  workspace: { $ref: '#/components/schemas/WorkSpace' }
                  message: { type: string, example: Workspace updated successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/StatusValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspace/delete:
    post:
      tags: [Workspaces]
      summary: Delete a workspace
      operationId: deleteWorkspace
      description: |
        ⚠️ **Currently broken.** After validation passes, the controller calls `$this->featureService`, which is never set, so every valid request returns **500**.
        Intended behavior: only the owner can delete, at least one workspace must remain (**400**), and the active/default flags move to another workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, example: 3 }
      responses:
        '200':
          description: Deleted (intended, not reachable today)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: success, message: Workspace deleted successfully }
        '400':
          description: Last remaining workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: error, message: You must have at least one workspace. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: No permission, or the caller is not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:
                permission: { value: { status: error, message: You do not have permission to delete this workspace. } }
                owner: { value: { status: error, message: Unauthorized workspace access. } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspaces/{workspace}:
    post:
      tags: [Workspaces]
      summary: Switch the active workspace
      operationId: activateWorkspace
      description: |
        Every site-scoped endpoint uses the active workspace, so refetch sites and other data after switching.
        Note that `status` is a **boolean** here, not a string.
      parameters:
        - name: workspace
          in: path
          required: true
          schema: { type: integer, example: 3 }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: true }
                  message: { type: string, example: Workspace activated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: User has no access to that workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: false }
                  message: { type: string, example: You do not have access to this workspace }
        '500': { $ref: '#/components/responses/ServerError' }

  /workspace/openai-key:
    post:
      tags: [Workspaces]
      summary: Save an OpenAI API key on the active workspace (stored encrypted)
      operationId: saveWorkspaceOpenAiKey
      description: ⚠️ **Currently broken.** The `work_spaces.openai_api_key_encrypted` column has no migration, so a valid request returns **500** until that column is added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openai_api_key]
              properties:
                openai_api_key: { type: string, minLength: 10, example: sk-proj-xxxxxxxxxxxx }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: success, message: OpenAI API key saved successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── ACCOUNT ─────────────────────────────
  /user/update-name:
    post:
      tags: [Account]
      summary: Change the logged-in user's name
      operationId: updateMyName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: string, maxLength: 255, example: Jane }
                last_name: { type: string, maxLength: 255, example: Doe }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: Name updated successfully }
                  user: { $ref: '#/components/schemas/LoginUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/StatusValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /user/update-password:
    post:
      tags: [Account]
      summary: Change the logged-in user's password
      operationId: updateMyPassword
      description: Existing tokens stay valid. The current password is **not** required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: success, message: Password updated successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/StatusValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /cancle/subscription:
    post:
      tags: [Account]
      summary: Cancel a Paddle subscription immediately
      operationId: cancelSubscription
      description: |
        Note the misspelled path (`cancle`), which is how the route is defined.
        ⚠️ **Currently broken, and it calls Paddle before failing.** The Paddle cancel request is sent first. The controller then looks up `paddle_subscription_id` on the `subscription_models` table, which has no such column (it exists only on the addons table), so the request returns **500** *after* Paddle has already cancelled the subscription.
        ⚠️ The backend does not check that the subscription belongs to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionId]
              properties:
                subscriptionId: { type: string, example: sub_01h8x9y2z3 }
      responses:
        '200':
          description: Cancelled (intended). `status` is a boolean here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean, example: true }
                  message: { type: string, example: Subscription cancelled successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── TEAM ─────────────────────────────
  /team:
    get:
      tags: [Team]
      summary: List team members and the workspace owner's workspaces
      operationId: listTeam
      description: Use `workspaces` to build the `user_access` checkboxes when adding or editing a member.
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  currentWorkspace: { $ref: '#/components/schemas/WorkSpace' }
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/WorkSpace' }
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/LoginUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NoWorkspaceAvailable' }
        '500': { $ref: '#/components/responses/ServerError' }

  /team/add:
    post:
      tags: [Team]
      summary: Add a team member
      operationId: addTeamMember
      description: |
        Permission rules:
        - `client_member` callers cannot add anyone (**403**).
        - `team_member` callers can add only `client_member` users (**403** otherwise).
        - At least one `user_access[].has_access = true` is required unless `role = admin_team_member`, which gets every listed workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamMemberInput'
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, format: password, minLength: 8 }
            example:
              first_name: Sam
              last_name: Lee
              email: sam@example.com
              password: secret123
              role: team_member
              user_access:
                - { id: 1, has_access: true }
                - { id: 3, has_access: false }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: User added to team successfully }
                  user: { $ref: '#/components/schemas/LoginUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Role does not allow this
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:
                client: { value: { status: error, message: You do not have permission to add team members. } }
                teamMember: { value: { status: error, message: You can only add client members. } }
        '422':
          description: Validation failed, or no workspace access granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:
                validation: { value: { status: error, message: Validation failed, errors: { email: [The email has already been taken.] } } }
                noAccess: { value: { status: error, message: You must grant access to at least one workspace. } }
        '500': { $ref: '#/components/responses/ServerError' }

  /team/update:
    post:
      tags: [Team]
      summary: Update a team member (details, role, workspace access, optional password)
      operationId: updateTeamMember
      description: Workspaces sent with `has_access false` are removed from the member. Workspaces you don't send are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TeamMemberInput'
                - type: object
                  required: [id]
                  properties:
                    id: { type: integer, example: 12 }
                    password: { type: string, format: password, minLength: 6, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: User details updated successfully }
                  user: { $ref: '#/components/schemas/LoginUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not allowed for the caller's role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:
                notCreator: { value: { status: error, message: You can only update users you have created. } }
                client: { value: { status: error, message: You do not have permission to update this user. } }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: error, message: User not found. }
        '422': { $ref: '#/components/responses/StatusValidationError' }
        '500': { $ref: '#/components/responses/StatusServerError' }

  /team/update/password:
    post:
      tags: [Team]
      summary: Set a team member's password
      operationId: updateTeamMemberPassword
      description: Allowed only when the target user's `edit_access` is true for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password, password_confirmation]
              properties:
                id: { type: integer, example: 12 }
                password: { type: string, format: password, minLength: 6 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: Password updated successfully. }
                  user: { $ref: '#/components/schemas/LoginUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: No edit access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: error, message: You do not have permission to update this password. }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: error, message: Validation failed., errors: { password: [The password field confirmation does not match.] } }
        '500': { $ref: '#/components/responses/StatusServerError' }

  /team/delete:
    delete:
      tags: [Team]
      summary: Delete a team member
      operationId: deleteTeamMember
      description: |
        Send `id` in the JSON body (DELETE with body) or as `?id=`.
        Only the member's creator (`parent_id`) can delete them, and `team_member` callers can delete only `client_member` users.
        ⚠️ Validation errors (missing or unknown `id`) are caught by a generic handler and come back as **500** instead of 422.
        ⚠️ Success returns **201** instead of 200.
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: integer, example: 12 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, example: 12 }
      responses:
        '201':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example: { status: success, message: User deleted successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:
                notCreator: { value: { status: error, message: You can only delete users you have created. } }

        '422':

              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              examples:

        '500': { $ref: '#/components/responses/StatusServerError' }
